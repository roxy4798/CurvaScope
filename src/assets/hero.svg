<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="heroBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="heroCurveGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="heroAreaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Frame Background -->
  <rect width="800" height="450" rx="20" fill="url(#heroBgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Subtle Analytical Grid -->
  <g stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4">
    <line x1="80" y1="80" x2="720" y2="80"/>
    <line x1="80" y1="160" x2="720" y2="160"/>
    <line x1="80" y1="240" x2="720" y2="240"/>
    <line x1="80" y1="320" x2="720" y2="320"/>
    <line x1="200" y1="60" x2="200" y2="370"/>
    <line x1="330" y1="60" x2="330" y2="370"/>
    <line x1="460" y1="60" x2="460" y2="370"/>
    <line x1="590" y1="60" x2="590" y2="370"/>
  </g>

  <!-- Concentrated Liquidity Virtual Depth Columns (Simulated 6 segments) -->
  <g opacity="0.18">
    <rect x="100" y="325" width="80" height="45" fill="#38bdf8" rx="4"/>
    <rect x="200" y="300" width="80" height="70" fill="#38bdf8" rx="4"/>
    <rect x="300" y="260" width="80" height="110" fill="#fb923c" rx="4"/>
    <rect x="400" y="210" width="80" height="160" fill="#fb923c" rx="4"/>
    <rect x="500" y="145" width="80" height="225" fill="#f97316" rx="4"/>
    <rect x="600" y="80" width="80" height="290" fill="#f97316" rx="4"/>
  </g>

  <!-- Curve Area Fill -->
  <path d="M 100 345 C 220 340, 360 300, 480 230 C 580 170, 640 110, 680 80 L 680 370 L 100 370 Z" fill="url(#heroAreaGrad)"/>

  <!-- Dynamic Bonding Curve Primary Line -->
  <path d="M 100 345 C 220 340, 360 300, 480 230 C 580 170, 640 110, 680 80" fill="none" stroke="url(#heroCurveGrad)" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Segment Boundary Milestone Nodes -->
  <circle cx="100" cy="345" r="5" fill="#38bdf8" stroke="#080d1a" stroke-width="2"/>
  <circle cx="280" cy="320" r="5" fill="#38bdf8" stroke="#080d1a" stroke-width="2"/>
  <circle cx="440" cy="255" r="5" fill="#fb923c" stroke="#080d1a" stroke-width="2"/>
  <circle cx="560" cy="180" r="5" fill="#f97316" stroke="#080d1a" stroke-width="2"/>

  <!-- Graduation Target Node -->
  <circle cx="680" cy="80" r="8" fill="#f97316" stroke="#ffffff" stroke-width="2.5"/>
  <circle cx="680" cy="80" r="14" fill="none" stroke="#f97316" stroke-width="1.5" opacity="0.6"/>

  <!-- Axes -->
  <line x1="80" y1="370" x2="720" y2="370" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
  <line x1="80" y1="60" x2="80" y2="370" stroke="#475569" stroke-width="2" stroke-linecap="round"/>

  <!-- Labels -->
  <text x="720" y="395" fill="#94a3b8" font-family="monospace" font-size="12" text-anchor="end">Quote Reserve (SOL/USDC) ?</text>
  <text x="75" y="50" fill="#94a3b8" font-family="monospace" font-size="12">Price (P)</text>
  <text x="680" y="60" fill="#f97316" font-family="monospace" font-size="12" text-anchor="middle" font-weight="bold">Graduation (DAMM v2)</text>
  <text x="100" y="395" fill="#64748b" font-family="monospace" font-size="11">Initial (P_0)</text>
</svg>
